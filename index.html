<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1030" />
    <title>Berry Beats</title>
    <link rel="preload" href="./assets/fonts/Glacier35.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Glacier35';
        src: url('./assets/fonts/Glacier35.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120a24;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;

      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;

      canvas {
        display: block;
        image-rendering: pixelated;
      }

    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>

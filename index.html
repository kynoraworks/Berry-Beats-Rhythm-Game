<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120a24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Berry Beats" />
    <title>Berry Beats</title>
    <meta name="description" content="A pixel art rhythm game about fruit-inspired dancers. Hit the arrows on the beat, win dance battles and make your own beat maps." />
    <!-- Link previews need absolute URLs: change these if the game moves to another address. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Berry Beats" />
    <meta property="og:description" content="A pixel art rhythm game about fruit-inspired dancers. Hit the arrows on the beat and win dance battles." />
    <meta property="og:url" content="https://berry-beats.vercel.app/" />
    <meta property="og:image" content="https://berry-beats.vercel.app/share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Berry Beats" />
    <meta name="twitter:description" content="A pixel art rhythm game about fruit-inspired dancers. Hit the arrows on the beat and win dance battles." />
    <meta name="twitter:image" content="https://berry-beats.vercel.app/share.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preload" href="./assets/fonts/Glacier35.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'Glacier35';
        src: url('./assets/fonts/Glacier35.ttf') format('truetype');
        font-display: block;
      }
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('./assets/fonts/PixelifySans-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: block;
      }
      @font-face {
        font-family: 'Pixelify Sans';
        src: url('./assets/fonts/PixelifySans-Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120a24;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      /* Keep the canvas clear of notches and rounded corners. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }

      /* Four tap columns shown while playing on a touch screen. */
      #touch-lanes {
        position: fixed;
        inset: 0;
        display: none;
        pointer-events: none;
      }
      #touch-lanes.shown {
        display: flex;
      }
      #touch-lanes div {
        flex: 1;
        border-left: 2px solid rgba(255, 246, 224, 0.1);
        background: linear-gradient(to top, var(--lane) 0%, transparent 38%);
        opacity: 0.2;
      }
      #touch-lanes div:first-child {
        border-left: none;
      }
      #touch-lanes div.down {
        opacity: 0.65;
      }

      /* The game is landscape only: ask phones held upright to turn. */
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #120a24;
        color: #fff6e0;
        font: 28px 'Glacier35', monospace;
        text-align: center;
        z-index: 10;
      }
      #rotate .phone {
        width: 64px;
        height: 112px;
        border: 6px solid #c9adff;
        border-radius: 12px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        25% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="touch-lanes" aria-hidden="true">
      <div style="--lane: #4fd62f"></div>
      <div style="--lane: #f03cc0"></div>
      <div style="--lane: #f2303c"></div>
      <div style="--lane: #ff8a1e"></div>
    </div>
    <div id="rotate">
      <div class="phone"></div>
      <div>rotate your device<br />to play</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
